apis:
- aid: cellarity:content
  name: Cellarity Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that cellarity.com serves at
    /wp-json/wp/v2 — news items (the `news_item` custom post type, 48 published), the
    drug-development pipeline (`pipeline-item`, 6 published, classified by `pipeline-category`),
    leadership / board / founder profiles (`team-member`, 19 published, classified by
    `team-category`), event speakers (`event-speaker`, 11 published), case studies
    (`case-study`), platform and culture videos (`team-video`, `mindset-video`), marketing pages,
    the 207-object media library, taxonomies including the `article-type` newsroom classification
    (news / press / publication / presentation / media / ext), and a site-wide search endpoint —
    all as JSON with page/per_page pagination and X-WP-Total / X-WP-TotalPages headers. This is
    the CMS content API, not a Cellarity product API; Cellarity publishes no OpenAPI for it, so
    the definition in this repo was derived mechanically from the live route-discovery document
    at https://cellarity.com/wp-json/. Write operations exist on every route but require
    WordPress Application Passwords over HTTP Basic; anonymous writes and the settings and
    wp-abilities registries return 401 rest_forbidden.'
  humanURL: https://cellarity.com/news-events/
  baseURL: https://cellarity.com/wp-json/wp/v2
