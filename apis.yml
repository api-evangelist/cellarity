aid: cellarity
name: Cellarity
description: 'Cellarity is a Somerville, Massachusetts based clinical-stage biotechnology company
  founded in 2017 inside Flagship Labs by Flagship Pioneering, which discovers medicines against
  the cell as a whole rather than a single molecular target. Its multi-omics, AI-powered platform
  is trained on tens of millions of single-cell transcriptomes to characterize disease as a shift
  in cell state and to design small molecules that course-correct that state back toward health.
  The company has raised roughly $294M across Series A, B and C rounds from Flagship Pioneering,
  BlackRock, The Baupost Group and Pictet Group, runs an active MASH collaboration with Novo
  Nordisk, and is advancing CLY-124 — a first-in-class globin-switching oral medicine for sickle
  cell disease — through a Phase 1 clinical study, alongside myelofibrosis and exploratory
  hematology programs. Cellarity publishes no product or developer API and runs no developer
  program; its only anonymously readable machine-readable surface is the WordPress REST API
  (wp/v2) that serves cellarity.com — news items, the drug-development pipeline, leadership and
  board profiles, event speakers, case studies, platform videos, media and site search — as JSON.
  Its scientific software is published as open-source research code in the github.com/Cellarity
  organization (DrugReflector, DILImap, MolRL), and its technical documentation site at
  docs.cellarity.com is a private Read the Docs Business instance behind SSO.'
