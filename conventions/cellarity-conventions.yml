  detail: lifecycle/cellarity-lifecycle.yml
error_envelope:
  format: wordpress-rest
  rfc9457: false
  content_type: application/json
  shape: '{code: string, message: string, data: {status: integer, params?: object, details?: object}}'
  detail: errors/cellarity-problem-types.yml
rate_limiting:
  documented: false
  headers_observed: []
  detail: >-
    No rate-limit headers (X-RateLimit-*, RateLimit-*, Retry-After) were returned on any probe and
    no rate-limit policy is published. WP Engine applies unpublished edge protections; treat the
    effective limit as unknown and back off on 429/503.
