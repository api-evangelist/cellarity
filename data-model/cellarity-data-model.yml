taxonomies:
- name: ArticleType
  taxonomy: article-type
  collection: /wp/v2/article-type
  applies_to: [news_item]
  terms:
  - {slug: news, name: News, count: 29}
  - {slug: press, name: Press, count: 14}
  - {slug: ext, name: Ext, count: 11}
  - {slug: publication, name: Publication, count: 2}
  - {slug: presentation, name: Presentation, count: 2}
  - {slug: media, name: Media, count: 1}
  note: >-
    Term counts total 59 against 48 news items, so items carry more than one term. This is the
    most useful filter on the whole API — it separates original press releases from external
    coverage and from peer-reviewed publications.
- name: PipelineCategory
  taxonomy: pipeline-category
  collection: /wp/v2/pipeline-category
  applies_to: [pipeline-item]
