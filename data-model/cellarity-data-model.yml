traversal:
  hypermedia: >-
    Every object embeds `_links` with self, collection, about (the type descriptor at
    /wp/v2/types/{type}), wp:featuredmedia, wp:attachment and wp:term relations. `?_embed=1`
    inlines featured media, author and terms in one round trip, which is the efficient way to walk
    this graph.
  cross_type_search: >-
    /wp/v2/search returns {id, title, url, type, subtype} across every public type — the only
    operation that spans entities. Observed subtype values include news_item.
