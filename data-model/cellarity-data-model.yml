source: openapi/cellarity-content-openapi.yml + live object/taxonomy inspection of https://cellarity.com/wp-json/wp/v2
summary: >-
  Entity-relationship graph of the cellarity.com WordPress content model. Derived from the route
  descriptor's registered post types and taxonomies, then confirmed against live objects — every
  relationship below was verified by observing the linking field on a real record, not assumed
  from WordPress defaults. The model is a small content graph: five populated editorial entities
  (news items, pipeline programs, team members, event speakers, case studies), two video types,
  and the taxonomies that classify them.
identifiers:
  scheme: integer
  detail: >-
    All objects key on a site-unique integer `id` drawn from a single wp_posts sequence shared
    across post types, plus a separate sequence for taxonomy terms. IDs are NOT namespaced by
    type: /wp/v2/news_item/1414 returns 404 rest_post_invalid_id because 1414 is a pipeline-item.
    A `slug` is unique within a type and is the stable, human-readable key.
entities:
- name: NewsItem
  post_type: news_item
  collection: /wp/v2/news_item
  operations: [listNewsItems, getNewsItem]
  count: 48
  description: Corporate newsroom — press releases, publications, presentations and external coverage.
  key_fields: [id, slug, date, modified, link, title.rendered, content.rendered, excerpt.rendered, featured_media, article-type]
  relationships:
  - type: has_many
    target: ArticleType
    via: article-type
    description: Taxonomy term IDs classifying the item. Observed on id 1561 -> [10] (press).
  - type: has_one
    target: MediaItem
    via: featured_media
    description: Integer media ID, 0 when unset.
  - type: belongs_to
    target: User
    via: author
- name: PipelineItem
  post_type: pipeline-item
  collection: /wp/v2/pipeline-item
  operations: [listPipelineItems, getPipelineItem]
  count: 6
  description: >-
    Drug-development programs and the pipeline chart rows that render them — CLY-124 (sickle cell),
    Myelofibrosis, Exploratory Hematology, MASH, In Development.
  key_fields: [id, slug, link, title.rendered, content.rendered, pipeline-category]
  relationships:
  - type: has_many
    target: PipelineCategory
    via: pipeline-category
    description: >-
      Observed on id 1414 -> [22] (the-details) and id 1349 -> [23, 21] (pipeline-chart +
      show-popup). The taxonomy is used for presentation role, not therapeutic area.
- name: TeamMember
  post_type: team-member
  collection: /wp/v2/team-member
  operations: [listTeamMembers, getTeamMember]
  count: 19
  description: Leadership, founders and board profiles.
  key_fields: [id, slug, link, title.rendered, content.rendered, featured_media, team-category]
  relationships:
  - type: has_many
    target: TeamCategory
    via: team-category
    description: Observed on id 1573 -> [16] (management).
  - type: has_one
    target: MediaItem
    via: featured_media
- name: EventSpeaker
  post_type: event-speaker
  collection: /wp/v2/event-speaker
  operations: [listEventSpeakers, getEventSpeaker]
  count: 11
  description: Speakers featured on the symposium/events pages.
  key_fields: [id, slug, link, title.rendered, content.rendered, featured_media]
  relationships:
  - type: has_one
    target: MediaItem
    via: featured_media
- name: CaseStudy
  post_type: case-study
  collection: /wp/v2/case-study
  operations: [listCaseStudies, getCaseStudy]
  count: 1
  key_fields: [id, slug, link, title.rendered, content.rendered, case-study-category]
  relationships:
  - type: has_many
    target: CaseStudyCategory
