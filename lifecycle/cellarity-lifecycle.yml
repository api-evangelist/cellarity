source: openapi/cellarity-content-openapi.yml + https://cellarity.com/wp-json/ route descriptor + site probes
summary: >-
  Cellarity operates no API lifecycle program. There is no versioning policy, no deprecation
  policy, no Sunset/Deprecation header support, no SLA, no status page and no API changelog,
  because Cellarity does not hold out an API to anyone — the surface catalogued here is the
  WordPress CMS backing cellarity.com. The versioning that exists is WordPress core's own
  namespace scheme, which Cellarity inherits rather than governs. No StatusPage and no Deprecation
  pointer is emitted; emitting either would credit Cellarity with an operational commitment it has
  not made.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  governed_by: WordPress core (upstream), not Cellarity
  docs: null
  detail: >-
    The version is a path namespace — /wp-json/wp/v2. WordPress has held wp/v2 stable since 2016
    and adds capability through new namespaces rather than by breaking v2. Site-specific custom
    post types (news_item, pipeline-item, team-member, event-speaker, case-study, team-video,
    mindset-video) are registered INTO wp/v2 by Cellarity's theme and plugins, which means the
    shape of this API can change whenever the site is rebuilt, with no notice and no version bump.
  namespaces_present:
  - wp/v2
  - oembed/1.0
  - yoast/v1
  - divi/v1
  - da/v1
  - wp-site-health/v1
  - wp-block-editor/v1
  - wp-abilities/v1
  - real-custom-post-order/v1
  - real-utils/v1
  - duplicate-post/v1
  - wpe/cache-plugin/v1
  - wpe_sign_on_plugin/v1
