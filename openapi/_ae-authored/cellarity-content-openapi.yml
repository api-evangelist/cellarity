openapi: 3.1.0
info:
  title: Cellarity Content API (WordPress REST wp/v2)
  version: wp/v2
  summary: 'Public read surface of cellarity.com content: news items, drug-development pipeline programs, leadership
    and team profiles, event speakers, case studies, platform videos, marketing pages, media and site search.'
  description: 'Cellarity publishes cellarity.com on WordPress (WP Engine), which exposes the WordPress REST API
    at https://cellarity.com/wp-json/. The `wp/v2` namespace is anonymously readable and returns the company''s
    news items (`news_item`), drug-development pipeline programs (`pipeline-item` + `pipeline-category`), leadership
    / board / team profiles (`team-member` + `team-category`), event speakers (`event-speaker`), case studies (`case-study`),
    platform and culture videos (`team-video`, `mindset-video`), marketing pages, the media library, taxonomies
    and a site-wide search endpoint as JSON.


    This document was DERIVED mechanically by API Evangelist from the route-discovery document served at https://cellarity.com/wp-json/
    on 2026-08-09 — every path, method and parameter below is taken verbatim from that descriptor. Cellarity does
    not publish an OpenAPI definition of its own, and this is NOT a Cellarity product API: it is the content API
    the CMS exposes. Write operations exist on these routes but require authentication (WordPress Application Passwords
    over HTTP Basic); anonymous writes return 401 `rest_forbidden`. Block-editor, theming and site-administration
    routes present in the descriptor are deliberately excluded from this document.'
  contact:
    name: Cellarity
    url: https://cellarity.com/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://cellarity.com/wp-json/
  x-derived-on: '2026-08-09'
  x-provider-published: false
servers:
- url: https://cellarity.com/wp-json
  description: Production
