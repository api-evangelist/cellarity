summary: >-
  Cellarity ships no API client libraries or SDKs — it has no product API to write one against.
  What it does publish is first-party open-source SCIENTIFIC software: three research packages in
  the github.com/Cellarity organization implementing methods from its own publications. One of
  them, DILImap, is distributed on PyPI and is authored from a cellarity.com address, which is
  what makes it verifiably first-party. These are research libraries, not clients for the
  cellarity.com content API, so no `SDKs` pointer is emitted for them — doing so would credit
  Cellarity with an SDK surface it does not have.
