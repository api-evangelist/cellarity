summary: >-
  Cellarity publishes no /.well-known/ discovery documents. Every RFC 8615 path probed on
  cellarity.com returns a hard 404 from the WordPress/WP Engine origin. The docs host
  docs.cellarity.com is a Read the Docs Business instance that 302s every path — including every
  /.well-known/ path — to an SSO login, so no document can be read there and no 200 was recorded
  as a hit. No security.txt (RFC 9116), no OIDC or OAuth authorization-server metadata, no
  api-catalog (RFC 9727), no ai-plugin manifest and no A2A agent card exist on either host.
